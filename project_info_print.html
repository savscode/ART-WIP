<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Information</title>
    <style>
        @font-face {
            font-family: 'CircularStd-Bold';
            src: url('font/CircularStd-Bold.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'CircularStd-Bold', sans-serif;
            background-color: #ebebeb;
        }

        #custom-contact-form {
            max-width: 560px;
            margin: 60px auto;
            padding: 50px;
            border: 3px solid #000;
            box-sizing: border-box;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        .form-group label {
            font-size: 14px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #5f5f5f;
            margin-bottom: 6px;
            font-weight: normal;
        }

        .form-group input,
        .form-group textarea {
            font-size: 18px;
            font-family: 'CircularStd-Bold', sans-serif;
            padding: 6px 0;
            border: none;
            border-bottom: 2px solid #000;
            background-color: transparent;
            color: #000;
        }

        .form-group .date-display {
            font-size: 18px;
            padding: 6px 0;
            border-bottom: 2px solid #000;
            background-color: transparent;
            color: #000;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 40px;
        }
    </style>
</head>
<body>

    <div class="header"></div>
<div id="custom-contact-form">
    <h1>ART-Bestämning</h1>
    <div class="form-group">
        <label for="datum">Datum</label>
        <div class="date-display" id="datum-display"></div>
        <input type="hidden" id="datum" name="datum">
    </div>
    <div class="form-group">
        <label for="projekt">Vilket projekt</label>
        <input type="text" id="projekt" name="projekt">
    </div>
    <div class="form-group">
        <label for="affarsomrade">Vilket affärsområde</label>
        <input type="text" id="affarsomrade" name="affarsomrade">
    </div>
    <div class="form-group">
        <label for="plats">Plats</label>
        <input type="text" id="plats" name="plats">
    </div>
    <div class="form-group">
        <label for="skede">Vilket skede</label>
        <input type="text" id="skede" name="skede">
    </div>
    <div class="form-group">
        <label for="bestallare">Beställare</label>
        <input type="text" id="bestallare" name="bestallare">
    </div>
    <div class="form-group">
        <label for="team">Team</label>
        <input type="text" id="team" name="team">
    </div>
    <div class="form-group">
        <label for="forfattare">Författare</label>
        <input type="text" id="forfattare" name="forfattare">
    </div>
</div>

<script>
    // Display the date correctly when loaded for PDF export
    window.addEventListener('DOMContentLoaded', () => {
        // Try to get the date from sessionStorage or URL parameters
        const dateValue = new URLSearchParams(window.location.search).get('datum') || 
                         sessionStorage.getItem('datum') || 
                         '';
        
        if (dateValue) {
            document.getElementById('datum').value = dateValue;
            document.getElementById('datum-display').textContent = dateValue;
        }
        
        // Fill in other form fields from sessionStorage
        ['projekt', 'affarsomrade', 'plats', 'skede', 'bestallare', 'team', 'forfattare'].forEach(field => {
            const value = sessionStorage.getItem(field);
            if (value) {
                document.getElementById(field).value = value;
            }
        });
    });
</script>

</body>
</html>
