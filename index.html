<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ART</title>
  <!-- Förladda nästa sida medan startanimationen spelas, så hållbarhetsvisionen
       visas direkt när sidan byts (måste matcha filerna som ART.html använder) -->
  <link rel="prefetch" href="ART.html">
  <link rel="prefetch" href="script.js">
  <link rel="prefetch" href="project-examples.js">
  <link rel="prefetch" href="project-examples.css">
  <link rel="prefetch" href="step-common.css">
  <link rel="prefetch" href="vision.html">
  <link rel="prefetch" href="font/CircularStd-Bold.otf">
  <link rel="prefetch" href="font/CircularStd-Book.otf">
  <link rel="prefetch" href="font/IvarText-Regular.otf">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-regular-400.woff2">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  <!-- Behövs för pilen på "Testa ditt projekt" i förhandsvisningen nedan -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @font-face {
      font-family: 'CircularStd-Bold';
      src: url('font/CircularStd-Bold.otf') format('opentype');
    }

    @font-face {
      font-family: 'IvarText-Regular';
      src: url('font/IvarText-Regular.otf') format('opentype');
    }

    /* Hållbarhetsvisionen ligger direkt under startsidan (utanför bild) och
       följer med när sidan glider upp - som om man rullar fram nästa sida.
       Måste ligga exakt där texten hamnar i ART.html: body där har
       margin 20px + padding 20px (step-common.css), och reglerna för .header
       nedan är kopior av dem i step-common.css. Ändras de där, ändra här. */
    .next-page-preview {
      position: absolute;
      top: 100%;
      left: 0;
      width: calc(100% - var(--scrollbar-width, 0px)); /* ART.html har rullningslist */
      height: 100%;
      box-sizing: border-box;
      padding: 40px;
      text-align: left;
      background-color: #ebebeb; /* Samma som ART.html - täcker trianglarna som når utanför bild */
      z-index: 3;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .next-page-preview .header {
      padding: 20px 20px 20px 40px;
    }

    .next-page-preview .header h1 {
      font-size: clamp(2.2em, 5vw, 4em);
      margin: 0;
      font-family: 'CircularStd-Bold', Arial, sans-serif;
    }

    .next-page-preview .header p {
      font-size: clamp(1em, 1.6vw, 1.3em);
      color: #000000;
      font-family: 'IvarText-Regular', Arial, sans-serif;
      max-width: min(60%, 700px);
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'CircularStd-Bold', sans-serif;
      background-color: #ebebeb; /* Set background color to match the lower field */
      /* Uppglidningen: lugn rörelse som bromsar in mjukt när visionstexten
         når sin plats. Längden (1.8s) måste matcha SLIDE_UP_MS i skriptet nedan. */
      transition: transform 1.8s cubic-bezier(0.45, 0, 0.15, 1);
    }

    /* body får inte klippa sitt innehåll: när .slide-up ger body en transform
       skulle overflow:hidden annars klippa bort visionstexten som ligger under
       sidan. Fönstret klipps ändå, via overflow:hidden på html. */
    body {
      overflow: visible;
    }

    .slide-up {
      transform: translateY(-100%); /* Slide the page up */
    }

    .diagonal-split {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .diagonal-split::before,
    .diagonal-split::after {
      content: '';
      position: absolute;
      width: 200%; /* Increased width to ensure full coverage */
      height: 200%; /* Increased height to ensure full coverage */
      top: -50%; /* Adjusted to center larger area */
      left: -50%; /* Adjusted to center larger area */
    }

    .diagonal-split::before {
      background-color: #d7d7d7; /* Dark gray */
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .diagonal-split::after {
      background-color: #ebebeb; /* Light gray */
      clip-path: polygon(0 100%, 100% 0, 100% 100%, 0 100%);
      transform-origin: 50% 50%; /* Center of the screen (pivot point) */
      transform: rotate(0deg);
      transition: transform 3s ease-in-out;
    }

    .diagonal-split.animate::after {
      transform: rotate(calc(var(--angle, 0deg)));
    }

    .center-text {
      position: absolute;
      z-index: 2; /* Ensure the text is on top */
      font-size: clamp(48px, 12vw, 100px); /* Skalar flytande med fönsterbredden */
      color: #ffffff; /* Adjust text color as needed */
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: clamp(8px, 3vw, 20px); /* Increase letter spacing */
    }

    .center-text span {
      display: inline-block;
      transition: transform 3s ease-in-out;
      transform: translateY(5px); /* Move text 5px down initially */
    }

    .center-text.animate .A,
    .center-text.animate .T {
      transform: translateY(-40px); /* Move text 30px up from initial position */
    }

    .center-text.animate .R {
      transform: translateY(50px); /* Move text 30px down from initial position */
    }

    /* Diskret ledtråd längst ner som tonas bort när animationen startar */
    .start-hint {
      position: absolute;
      bottom: 48px;
      z-index: 2;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a8a8a;
      transition: opacity 0.6s ease;
      animation: hintPulse 2.4s ease-in-out infinite;
    }

    .start-hint.hidden {
      opacity: 0 !important;
      animation: none;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="diagonal-split"></div>
  <div class="center-text">
    <span class="A">A</span>
    <span class="R">R</span>
    <span class="T">T</span>
  </div>
  <div class="start-hint">Klicka för att börja</div>
  <div class="next-page-preview" aria-hidden="true"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Get reference to the diagonal-split element
        const diagonalSplit = document.querySelector('.diagonal-split');
        const centerText = document.querySelector('.center-text');

        // Calculate screen dimensions
        const width = window.innerWidth;
        const height = window.innerHeight;

        // Calculate the desired rotation angle in degrees
        const angle = Math.atan2(height, width) * (180 / Math.PI);

        // Startsidan = ny omgång: töm eventuella svar från en tidigare omgång i samma flik
        sessionStorage.clear();

        // Hämta hållbarhetsvisionen (vision.html) och lägg den under startsidan,
        // så texten finns på plats när sidan glider upp
        const preview = document.querySelector('.next-page-preview');
        fetch('vision.html')
            .then(res => res.ok ? res.text() : '')
            .then(html => {
                // Spara texten så ART.html kan visa den direkt, utan att hämta den igen
                if (html) sessionStorage.setItem('visionHtml', html);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                // Ta med vision.html:s egna stilar (t.ex. knappen) och själva texten
                doc.querySelectorAll('head style, body > *').forEach(el => preview.appendChild(el));
            })
            .catch(() => {});

        // ART.html har en rullningslist som gör sidan smalare - mät den så
        // förhandsvisningen bryter raderna på exakt samma ställen
        const probe = document.createElement('div');
        probe.style.cssText = 'position:absolute;top:-9999px;width:100px;height:100px;overflow:scroll;';
        document.body.appendChild(probe);
        document.documentElement.style.setProperty('--scrollbar-width', `${probe.offsetWidth - probe.clientWidth}px`);
        probe.remove();

        const SLIDE_UP_MS = 1800; // Måste matcha transition-längden på body i CSS:en ovan

        const startHint = document.querySelector('.start-hint');
        let started = false;

        // Starta animationen med klick, Enter eller mellanslag - bara en gång
        const start = () => {
            if (started) return;
            started = true;
            startHint.classList.add('hidden');
            diagonalSplit.style.setProperty('--angle', `${angle}deg`);
            diagonalSplit.classList.add('animate');
            centerText.classList.add('animate');

            // Navigate to ART.html after the animation is complete with a delay
            setTimeout(() => {
                document.body.classList.add('slide-up');
                setTimeout(() => {
                    // Säg till ART.html att visionen redan ligger på plats, så den
                    // inte glider in en gång till
                    sessionStorage.setItem('fromSplash', '1');
                    window.location.href = 'ART.html';
                }, SLIDE_UP_MS); // Match the duration of the slide-up transition
            }, 3000); // Match the duration of the rotation animation
        };

        document.addEventListener('click', start);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') start();
        });
    });

    // Kommer man tillbaka hit med bakåtknappen kan webbläsaren visa sidan
    // från cachen med animationen redan körd - ladda då om så den startar om
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) window.location.reload();
    });
  </script>
</body>
</html>
