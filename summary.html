<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultat</title>
    <link rel="stylesheet" href="step-common.css">
    <style>
        .header h2 {
            font-size: clamp(1.3em, 3vw, 2em);
            margin: 10px 0 0;
            font-family: 'CircularStd-Bold', Arial, sans-serif;
            font-style: bold;
        }

        .top-categories {
        float: left;
        width: 300px; /* Samma breddkänsla som en enskild parameterkolumn (Nyttjande, Skönhet osv) */
        padding: 20px 20px 20px 40px; /* Vänsterpadding matchar .header så texten linjerar */
        margin-left: 0px; /* Restore left margin for proper spacing */
        margin-top: 20px; /* Restore top margin */
        }

        @media (max-width: 700px) {
            .top-categories {
                float: none;
                width: auto;
            }
        }

        .top-categories h2 {
            font-size: 0.9em; /* Ändra storlek på label */
            margin-bottom: 10px; /* Lägg till marginal under label */
            margin-top: 50px;
            display: block; /* Gör label till blockelement */
            font-family: 'CircularStd-Book', Arial, sans-serif;
            color: #000000;
            font-style: normal;
        }

        .top-categories ul {
            list-style-type: disc;
            padding: 20px;
        }

        .chart-container {
            position: fixed; /* Make it fixed to the viewport */
            top: 0;
            left: 0;
            width: 100vw; /* Fill the entire screen width */
            height: 100vh; /* Fill the entire screen height */
            z-index: -1; /* Place it in the background */
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateX(60px); /* Flytta rosen (och dess etiketter) lite åt höger */
            background-color: #ebebeb; /* Add a background color for better visibility */
        }
        #roseChart {
            width: 90%; /* Ensure the chart takes most of the container width */
            height: 90%; /* Ensure the chart takes most of the container height */
        }
        #labels-container {
            position: absolute;
            height: 200%;
            aspect-ratio: 1;
            pointer-events: none;
        }

        .category-label {
            position: absolute;
            transform-origin: center;
            font-size: 0.6em;
            color: #4a4a4a;
            font-family: 'CircularStd-Book', sans-serif;
            white-space: nowrap;
            text-align: center;
        }
        
        /* Add styling for the textbox */
        .action-textbox {
            width: calc(100% - 20px);
            height: 100px;
            padding: 10px;
            border: none;
            background: linear-gradient(to bottom, #5f5f5f 0.1px, transparent 1px) repeat-y;
            background-size: 100% 20px;
            background-position: 0 5px;
            margin-top: 10px;
            font-family: 'CircularStd-Book', Arial, sans-serif;
            font-size: 0.9em;
            color: #000000;
            line-height: 20px;
            resize: none;
            outline: none;
        }

        /* ===== Endast mobil (upp till 600px bred) =====
           Ordning uppifrån: rubrik + underrubrik, rosen (så stor som möjligt,
           centrerad), sedan resten av texten vänsterställd som rubriken.
           Rosen ligger i vanligt flöde istället för fast i bakgrunden. */
        @media (max-width: 600px) {
            .form-page:has(.chart-container) {
                display: flex;
                flex-direction: column;
            }

            .form-page:has(.chart-container) .header { order: 1; }
            .form-page:has(.chart-container) .chart-container { order: 2; }
            .form-page:has(.chart-container) .top-categories { order: 3; }

            /* Kvadrat lika bred som sidan. Etiketterna (#labels-container) skalas
               med höjden precis som på datorn, så de hamnar rätt runt rosen. */
            .chart-container {
                position: relative;
                width: 100%;
                height: auto;
                aspect-ratio: 1;
                z-index: auto;
                transform: none;
                background-color: transparent;
                overflow: hidden; /* Etikettlagret är större än rutan - ingen sidledsskroll */
                margin-top: 10px;
            }

            .top-categories {
                margin-top: 0;
            }

            .top-categories h2:first-child {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body class="summary-page">
  
    <div class="header">
        <h1>ART-Bestämning</h1>
        <h2>Sammanfattning</h2>
    </div>
    <div class="top-categories">
        <h2>Vi behöver prioritera arbetet med:</h2>
        <ul id="topCategoriesList"></ul>
        <h2>Visst fokus kommer även behöva läggas läggas på:</h2>
        <ul id="additionalCategoriesList"></ul>
        <h2>Vad behöver vi göra för att arbeta med prioriterade ämnen?:</h2>
        <textarea id="actionPlan" name="actionPlan" class="action-textbox" placeholder=""></textarea>
    </div>
    <div class="chart-container">
        <div id="roseChart"></div>
        <div id="labels-container"></div> <!-- Här placeras kategorinamnen -->
    </div>
</body>
</html>
